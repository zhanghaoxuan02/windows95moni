            const face = document.getElementById('ms-face');
            if (!grid) return;
            const rows = 9,
                cols = 9,
                mines = 10;
            msState = {
                rows,
                cols,
                mines,
                board: [],
                revealed: [],
                flagged: [],
                gameOver: false,
                started: false,
                timer: 0,
                timerInterval: null,
                remainingMines: mines
            };
            for (let r = 0; r < rows; r++) { msState.board[r] = Array(cols).fill(0);
                msState.revealed[r] = Array(cols).fill(false);
                msState.flagged[r] = Array(cols).fill(false); }
            let placed = 0;
            while (placed < mines) { const rr = Math.floor(Math.random() * rows),
                    cc = Math.floor(Math.random() * cols); if (msState.board[rr][cc] !== 'X') { msState.board[rr][cc] =
                        'X';
                    placed++; } }
            for (let r = 0; r < rows; r++)
                for (let c = 0; c < cols; c++)
                    if (msState.board[r][c] !== 'X') { let count = 0; for (let dr = -1; dr <= 1; dr++)
                            for (let dc = -1; dc <= 1; dc++) { const nr = r + dr,
                                    nc = c + dc; if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && msState.board[nr][
                                        nc
                                    ] === 'X') count++; } msState.board[r][c] = count; }
            if (msState.timerInterval) clearInterval(msState.timerInterval);
            msState.timer = 0;
            msState.gameOver = false;
            msState.started = false;
            msState.remainingMines = mines;
            counter.textContent = String(mines).padStart(3, '0');
            timer.textContent = '000';
            face.textContent = '🙂';
            renderMSGrid();
        }

        function renderMSGrid() {
            const grid = document.getElementById('ms-grid');
            if (!grid || !msState) return;
            grid.style.gridTemplateColumns = `repeat(${msState.cols},20px)`;
            grid.innerHTML = '';
            for (let r = 0; r < msState.rows; r++) {
                for (let c = 0; c < msState.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    if (msState.revealed[r][c]) {
                        cell.classList.add('revealed');
                        if (msState.board[r][c] === 'X') {
                            cell.textContent = '💣';
                            cell.classList.add('mine-exploded');
                        } else if (msState.board[r][c] > 0) {
                            cell.textContent = msState.board[r][c];
                            const colors = ['', '#0000ff', '#008000', '#ff0000', '#000080', '#800000', '#008080',
                                '#000000', '#808080'
                            ];
                            cell.style.color = colors[msState.board[r][c]] || '#000';
                        }
                    } else if (msState.flagged[r][c]) {
                        cell.textContent = '🚩';
                        cell.classList.add('flagged');
                    }
                    cell.addEventListener('click', (e) => msClick(r, c));
                    cell.addEventListener('contextmenu', (e) => { e.preventDefault();
                        msRightClick(r, c); });
                    grid.appendChild(cell);
                }
            }
            document.getElementById('ms-counter').textContent = String(msState.remainingMines).padStart(3, '0');
            document.getElementById('ms-timer').textContent = String(msState.timer).padStart(3, '0');
        }

        function msClick(r, c) {
            if (!msState || msState.gameOver || msState.flagged[r][c] || msState.revealed[r][c]) return;
            if (!msState.started) { msState.started = true;
                msState.timerInterval = setInterval(() => { if (msState && msState.started && !msState.gameOver) {
                        msState.timer++;
                        document.getElementById('ms-timer').textContent = String(Math.min(msState.timer, 999))
                            .padStart(3, '0'); } }, 1000); }
            if (msState.board[r][c] === 'X') {
                msState.revealed[r][c] = true;
                msState.gameOver = true;
                if (msState.timerInterval) clearInterval(msState.timerInterval);
                document.getElementById('ms-face').textContent = '😵';
                for (let rr = 0; rr < msState.rows; rr++)
                    for (let cc = 0; cc < msState.cols; cc++)
                        if (msState.board[rr][cc] === 'X') msState.revealed[rr][cc] = true;
                renderMSGrid();
                setTimeout(() => alert('💥 踩到地雷了！游戏结束。'), 200);
                return;
            }
            msReveal(r, c);
            if (msCheckWin()) {
                msState.gameOver = true;
                if (msState.timerInterval) clearInterval(msState.timerInterval);
                document.getElementById('ms-face').textContent = '😎';
                for (let rr = 0; rr < msState.rows; rr++)
                    for (let cc = 0; cc < msState.cols; cc++)
                        if (msState.board[rr][cc] === 'X') msState.flagged[rr][cc] = true;
                renderMSGrid();
                setTimeout(() => alert('🎉 恭喜你赢了！'), 200);
            }
            renderMSGrid();
        }

        function msReveal(r, c) {
            if (r < 0 || r >= msState.rows || c < 0 || c >= msState.cols) return;
            if (msState.revealed[r][c] || msState.flagged[r][c]) return;
            msState.revealed[r][c] = true;
            if (msState.board[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++) msReveal(r + dr, c + dc);
            }
        }

        function msRightClick(r, c) {
            if (!msState || msState.gameOver || msState.revealed[r][c] || !msState.started) return;
            msState.flagged[r][c] = !msState.flagged[r][c];
            msState.remainingMines += msState.flagged[r][c] ? -1 : 1;
            renderMSGrid();
            if (msCheckWin()) {
                msState.gameOver = true;
                if (msState.timerInterval) clearInterval(msState.timerInterval);
                document.getElementById('ms-face').textContent = '😎';
                setTimeout(() => alert('🎉 恭喜你赢了！'), 200);
            }
        }

        function msCheckWin() {
            for (let r = 0; r < msState.rows; r++)
                for (let c = 0; c < msState.cols; c++)
                    if (msState.board[r][c] !== 'X' && !msState.revealed[r][c]) return false;
            return true;
        }
        window.resetMinesweeper = resetMinesweeper;

        // ============ 计算器 ============
        function buildCalculator() {
            return `<div style="display:flex;flex-direction:column;padding:5px;background:#d4d0c8;height:100%;gap:3px;font-family:'Courier New',monospace;">
            <div id="calc-display" style="background:#fff;border:2px inset #808080;padding:5px 7px;font-size:17px;text-align:right;min-height:32px;">0</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;flex:1;" id="calc-btns">
              <button>7</button><button>8</button><button>9</button><button style="background:#e8e4dc;">/</button>
              <button>4</button><button>5</button><button>6</button><button style="background:#e8e4dc;">*</button>
              <button>1</button><button>2</button><button>3</button><button style="background:#e8e4dc;">-</button>
              <button>0</button><button>.</button><button style="background:#e8e4dc;">C</button><button style="background:#e8e4dc;">+</button>
              <button style="grid-column:span 4;background:#000080;color:#fff;">=</button>
            </div></div>`;
        }

        function initCalculator(id) {
            const disp = document.getElementById('calc-display');
            const btns = document.getElementById('calc-btns');
            if (!disp || !btns) return;
            let cur = '0',
                prev = '',
                op = null,
                reset = false;

            function upd() { disp.textContent = cur; }
            btns.querySelectorAll('button').forEach(b => {
                b.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const v = this.textContent;
                    if (v === 'C') { cur = '0';
                        prev = '';
                        op = null;
                        reset = false; } else if (v === '=') {
                        if (op && prev !== '') {
                            const a = parseFloat(prev),
                                b = parseFloat(cur);
                            let r = 0;
                            switch (op) {
                                case '+':
                                    r = a + b;
                                    break;
                                case '-':
                                    r = a - b;
                                    break;
                                case '*':
                                    r = a * b;
                                    break;
                                case '/':
                                    r = b !== 0 ? a / b : 'Err';
                                    break;
                            }
                            cur = String(r);
                            prev = '';
                            op = null;
                            reset = true;
                        }
                    } else if (['+', '-', '*', '/'].includes(v)) {
                        if (op && !reset && prev !== '') {
                            const a = parseFloat(prev),
                                b = parseFloat(cur);
                            let r = 0;
                            switch (op) {
                                case '+':
                                    r = a + b;
                                    break;
                                case '-':
                                    r = a - b;
                                    break;
                                case '*':
                                    r = a * b;
                                    break;
                                case '/':
                                    r = b !== 0 ? a / b : 'Err';
                                    break;
                            }
                            cur = String(r);
                        }
                        prev = cur;
                        op = v;
                        reset = true;
                    } else if (v === '.') { if (reset) { cur = '0.';
                            reset = false; } else if (!cur.includes('.')) cur += '.'; } else { if (reset || cur ===
                            '0') { cur = v;
                            reset = false; } else cur += v; }
                    upd();
                });
            });
        }

        // ============ 画图 ============
        function buildPaint() {
            return `<div style="display:flex;flex-direction:column;height:100%;background:#d4d0c8;">
            <div style="display:flex;gap:4px;padding:3px 5px;background:#d4d0c8;border-bottom:1px solid #808080;flex-wrap:wrap;align-items:center;">
              <span style="font-size:9px;">画笔:</span>
              <button class="ps-btn" data-size="2" style="font-weight:bold;font-size:9px;padding:2px 6px;">小</button>
              <button class="ps-btn" data-size="5" style="font-weight:bold;font-size:9px;padding:2px 6px;">中</button>
              <button class="ps-btn" data-size="10" style="font-weight:bold;font-size:9px;padding:2px 6px;">大</button>
              <span>|</span>
              <span class="pc-btn active" data-color="#000" style="background:#000;width:18px;height:18px;border:2px solid #fff #000 #000 #fff;cursor:pointer;"></span>
              <span class="pc-btn" data-color="#f00" style="background:#f00;width:18px;height:18px;border:2px solid #fff #000 #000 #fff;cursor:pointer;"></span>
              <span class="pc-btn" data-color="#080" style="background:#080;width:18px;height:18px;border:2px solid #fff #000 #000 #fff;cursor:pointer;"></span>
              <span class="pc-btn" data-color="#00f" style="background:#00f;width:18px;height:18px;border:2px solid #fff #000 #000 #fff;cursor:pointer;"></span>
              <span class="pc-btn" data-color="#fff" style="background:#fff;width:18px;height:18px;border:2px solid #fff #000 #000 #fff;cursor:pointer;"></span>
              <span>|</span>
              <button onclick="clearPaint()" style="font-size:9px;padding:2px 6px;">清除</button>
            </div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#808080;padding:6px;">
              <canvas id="paint-canvas" width="380" height="260" style="background:#fff;border:2px solid #000;max-width:100%;max-height:100%;cursor:crosshair;"></canvas>
            </div></div>`;
        }
        let paintBrushSize = 2,
            paintColor = '#000';

        function initPaint(id) {
            const canvas = document.getElementById('paint-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            let drawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas
                        .height / rect.height) };
            }
            canvas.onmousedown = function(e) { drawing = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.fillStyle = paintColor;
                ctx.strokeStyle = paintColor;
                ctx.lineWidth = paintBrushSize;
                ctx.lineCap = 'round';
                ctx.arc(p.x, p.y, paintBrushSize / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y); };
            canvas.onmousemove = function(e) { if (!drawing) return;
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y); };
            canvas.onmouseup = function() { drawing = false;
                ctx.beginPath(); };
            canvas.onmouseleave = function() { drawing = false;
                ctx.beginPath(); };
            document.querySelectorAll('.ps-btn').forEach(b => b.onclick = function() {
                document.querySelectorAll('.ps-btn').forEach(x => x.style.background = '#c0c0c0');
                this.style.background = '#e0e0e0';
                paintBrushSize = parseInt(this.dataset.size);
            });
            document.querySelectorAll('.pc-btn').forEach(b => b.onclick = function() {
                document.querySelectorAll('.pc-btn').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
                paintColor = this.dataset.color;
            });
        }
        window.clearPaint = function() {
            const c = document.getElementById('paint-canvas');
            if (c) { const ctx = c.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, c.width, c.height); }
        };

        // ============ 像素画 ============
        function drawPixelArt() {
            const canvas = document.getElementById('pixel-art-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d'),
                w = canvas.width,
                h = canvas.height;
            const sky = ctx.createLinearGradient(0, 0, 0, h * 0.5);
            sky.addColorStop(0, '#4a90d9');
            sky.addColorStop(1, '#b8d8f8');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, w, h * 0.5);
            ctx.fillStyle = '#fff7b0';
            ctx.beginPath();
            ctx.arc(w * 0.78, h * 0.16, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffe44d';
            ctx.beginPath();
            ctx.arc(w * 0.78, h * 0.16, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(w * 0.2, h * 0.12, 18, 0, Math.PI * 2);
            ctx.arc(w * 0.27, h * 0.09, 14, 0, Math.PI * 2);
            ctx.arc(w * 0.32, h * 0.12, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#7ab648';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.52);
            ctx.quadraticCurveTo(w * 0.3, h * 0.35, w * 0.55, h * 0.48);
            ctx.quadraticCurveTo(w * 0.75, h * 0.38, w, h * 0.44);
            ctx.lineTo(w, h * 0.55);
            ctx.lineTo(0, h * 0.55);
            ctx.fill();
            ctx.fillStyle = '#5da83d';
            ctx.fillRect(0, h * 0.5, w, h * 0.5);
            ctx.fillStyle = '#c9b896';
            ctx.beginPath();
            ctx.moveTo(w * 0.44, h);
            ctx.quadraticCurveTo(w * 0.46, h * 0.65, w * 0.49, h * 0.55);
            ctx.lineTo(w * 0.51, h * 0.55);
            ctx.quadraticCurveTo(w * 0.54, h * 0.65, w * 0.56, h);
            ctx.fill();
            for (let i = 0; i < 6; i++) {
                const fx = w * (0.12 + i * 0.14),
                    fy = h * (0.65 + Math.sin(i) * 0.08),
                    fc = ['#ff6b6b', '#ffcc00', '#ff6bb5', '#ff8800', '#ff4444', '#ffaa00'][i];
                ctx.fillStyle = fc;
                for (let j = 0; j < 5; j++) { const a = j / 5 * Math.PI * 2;
                    ctx.beginPath();
                    ctx.arc(fx + Math.cos(a) * 4, fy + Math.sin(a) * 4, 2.5, 0, Math.PI * 2);
                    ctx.fill(); }
                ctx.fillStyle = '#ffe44d';
                ctx.beginPath();
                ctx.arc(fx, fy, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#e8dcc8';
            ctx.fillRect(w * 0.33, h * 0.4, 35, 26);
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.moveTo(w * 0.31, h * 0.4);
            ctx.lineTo(w * 0.5, h * 0.28);
            ctx.lineTo(w * 0.54, h * 0.4);
            ctx.fill();
            ctx.fillStyle = '#5c3317';
            ctx.fillRect(w * 0.45, h * 0.44, 9, 12);
        }

        // ============ 运行命令 ============
        function runCommand() {
            const inp = document.getElementById('run-input');
            const cmd = (inp ? inp.value.trim().toLowerCase() : 'notepad');
            const map = { 'notepad': 'notepad', 'calc': 'calculator', 'calculator': 'calculator', 'paint': 'paint',
                'mspaint': 'paint', 'explorer': 'c_drive', 'winmine': 'minesweeper', 'minesweeper': 'minesweeper',
                'about': 'about', 'control': 'controlpanel' };
            closeWindow('run');
            openWindow(map[cmd] || 'notepad');
        }
        window.runCommand = runCommand;

        // ============ 时钟 ============
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes()
                .toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============ 全局事件 ============
        document.getElementById('desktop').addEventListener('mousedown', function(e) {
            if (e.target === this || e.target.id === 'desktop-icons' || e.target.id === 'windows-container') {
                deselectAllIcons();
                if (startMenuOpen) closeStartMenu();
                hideContextMenu();
                closeAllSubmenus();
            }
        });
        document.getElementById('desktop').addEventListener('contextmenu', function(e) {
            if (e.target === this || e.target.id === 'desktop-icons' || e.target.id === 'windows-container' || (e
                    .target.closest('#desktop-icons') && !e.target.closest('.desktop-icon'))) showContextMenu(e);
        });
        document.addEventListener('mousedown', function(e) {
            if (startMenuOpen && !document.getElementById('start-menu').contains(e.target) && !document.getElementById(
                    'start-button').contains(e.target)) closeStartMenu();
            if (!e.target.closest('.submenu') && !e.target.closest('.has-submenu')) closeAllSubmenus();
            if (!e.target.closest('#context-menu')) hideContextMenu();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('shutdown-overlay').classList.contains('show')) hideShutdownDialog();
                else if (startMenuOpen) closeStartMenu();
                hideContextMenu();
                closeAllSubmenus();
            }
            if (e.altKey && e.key === 'F4' && activeWindowId) { e.preventDefault();
                closeWindow(activeWindowId); }
            if ((e.key === 'Meta') || (e.ctrlKey && e.key === 'Escape')) { e.preventDefault(); if (startMenuOpen)
                    closeStartMenu();
                else openStartMenu(); }
        });
        window.addEventListener('resize', function() {
            Object.entries(openWindows).forEach(([, w]) => {
                if (w.maximized) { w.element.style.width = '100%';
                    w.element.style.height = 'calc(100vh - var(--taskbar-height))'; }
            });
        });
        document.getElementById('start-menu').addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('touchmove', function(e) { if (dragging) e.preventDefault(); }, { passive: false });

        // ============ 初始加载 ============
        console.log('🪟 Windows 95 模拟器已就绪！');
        console.log('  📄 可编辑DOC | 📊 可编辑XLS | 💿 文件浏览器');
        console.log('  💣 扫雷游戏 | 🖨️ 打印机 | ⚙️ 控制面板');
        console.log('  右键桌面查看完整上下文菜单');
        setTimeout(() => openWindow('about'), 400);
    </script>
