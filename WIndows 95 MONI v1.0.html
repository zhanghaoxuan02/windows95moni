<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 模拟器</title>
    <style>
        :root {
            --win-bg: #008080;
            --win-gray: #c0c0c0;
            --win-highlight: #ffffff;
            --win-dark-shadow: #000000;
            --win-title-active: #000080;
            --win-title-inactive: #808080;
            --win-button-face: #c0c0c0;
            --taskbar-height: 32px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: default;
            background: #000;
        }
        #win95-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }
        #win95-container.shutdown {
            opacity: 0;
            pointer-events: none;
        }
        #desktop {
            position: relative;
            flex: 1;
            background: var(--win-bg);
            overflow: hidden;
            z-index: 1;
            min-height: 0;
        }
        #desktop-icons {
            position: absolute;
            top: 10px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 2;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 72px;
            padding: 6px 3px 4px 3px;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
            border-radius: 0;
        }
        .desktop-icon:hover {
            border: 2px dotted #c0c0c0;
            background: rgba(255, 255, 255, 0.06);
        }
        .desktop-icon.selected {
            background: #000080;
            border: 2px dotted #c0c0c0;
        }
        .desktop-icon.selected .icon-label {
            color: #fff;
            background: #000080;
            text-shadow: none;
        }
        .desktop-icon .icon-image {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            pointer-events: none;
            margin-bottom: 2px;
            image-rendering: pixelated;
            filter: drop-shadow(1px 1px 0px rgba(0, 0, 0, 0.3));
        }
        .desktop-icon .icon-label {
            color: #ffffff;
            font-size: 9px;
            text-align: center;
            line-height: 1.15;
            word-wrap: break-word;
            max-width: 66px;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            padding: 1px 2px;
            letter-spacing: 0.2px;
        }
        .desktop-icon.selected .icon-label {
            text-shadow: none;
        }

        /* 窗口 */
        .window {
            position: absolute;
            min-width: 220px;
            min-height: 120px;
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            box-shadow: 2px 2px 0 0 rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            z-index: 10;
            resize: both;
            overflow: hidden;
        }
        .window.active {
            z-index: 100;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100vh - var(--taskbar-height)) !important;
            resize: none;
        }
        .window.minimized {
            display: none;
        }
        .window-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--win-title-inactive);
            color: #c0c0c0;
            padding: 2px 3px;
            cursor: move;
            min-height: 22px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
            gap: 3px;
        }
        .window.active .window-titlebar {
            background: var(--win-title-active);
            color: #fff;
        }
        .window-titlebar .title-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .window-titlebar .title-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
            min-width: 0;
            pointer-events: none;
        }
        .window-titlebar .title-buttons {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .win-btn {
            width: 16px;
            height: 14px;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            cursor: pointer;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-weight: bold;
            color: #000;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
            position: relative;
        }
        .win-btn:active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
            padding-top: 1px;
            padding-left: 1px;
        }
        .win-btn-minimize::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 3px;
            right: 3px;
            height: 2px;
            background: #000;
        }
        .win-btn-maximize::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1.5px solid #000;
            background: transparent;
        }
        .win-btn-restore::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            width: 6px;
            height: 5px;
            border: 1.5px solid #000;
            background: var(--win-button-face);
            z-index: 1;
        }
        .win-btn-restore::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 2px;
            width: 6px;
            height: 5px;
            border: 1.5px solid #000;
            background: var(--win-button-face);
            z-index: 0;
        }
        .win-btn-close::after {
            content: '✕';
            font-size: 9px;
            font-weight: bold;
            color: #000;
        }
        .window-content {
            flex: 1;
            background: #ffffff;
            border: 2px solid;
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            overflow: auto;
            position: relative;
            min-height: 50px;
        }
        .window-content.padded {
            padding: 8px;
        }
        .window-content.no-padding {
            padding: 0;
        }

        /* 图标视图 */
        .icon-view {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            align-items: flex-start;
        }
        .icon-view .drive-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 66px;
            padding: 5px 3px;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            font-size: 10px;
            color: #000;
        }
        .icon-view .drive-icon:hover {
            border: 2px dotted #000080;
            background: rgba(0, 0, 128, 0.05);
        }
        .icon-view .drive-icon .drv-img {
            font-size: 28px;
            margin-bottom: 2px;
            pointer-events: none;
        }
        .icon-view .drive-icon .drv-label {
            color: #000;
            font-size: 9px;
            word-wrap: break-word;
            max-width: 60px;
            line-height: 1.2;
            pointer-events: none;
        }

        /* DOC编辑器 */
        .doc-toolbar {
            display: flex;
            gap: 3px;
            padding: 3px 5px;
            background: #d4d0c8;
            border-bottom: 1px solid #808080;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        .doc-toolbar button,
        .doc-toolbar select {
            font-size: 10px;
            padding: 3px 8px;
            cursor: pointer;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            font-family: inherit;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
            min-height: 22px;
        }
        .doc-toolbar button:active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
        }
        .doc-editor {
            min-height: 200px;
            padding: 16px 20px;
            font-family: 'Times New Roman', serif;
            font-size: 13px;
            line-height: 1.7;
            color: #000;
            outline: none;
            background: #fff;
            height: 100%;
            overflow-y: auto;
        }
        .doc-editor:focus {
            outline: 1px dotted #000;
        }

        /* 表格编辑器 */
        .sheet-toolbar {
            display: flex;
            gap: 4px;
            padding: 3px 5px;
            background: #d4d0c8;
            border-bottom: 1px solid #808080;
            align-items: center;
            flex-shrink: 0;
            font-size: 10px;
        }
        .sheet-toolbar button {
            font-size: 10px;
            padding: 3px 8px;
            cursor: pointer;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            font-family: inherit;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
        }
        .sheet-toolbar button:active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
        }
        .sheet-table-wrap {
            overflow: auto;
            flex: 1;
            min-height: 150px;
        }
        .sheet-table-wrap table {
            border-collapse: collapse;
            font-size: 11px;
            table-layout: auto;
        }
        .sheet-table-wrap table th,
        .sheet-table-wrap table td {
            border: 1px solid #808080;
            padding: 0;
            min-width: 70px;
            height: 22px;
            text-align: left;
            vertical-align: middle;
        }
        .sheet-table-wrap table th {
            background: #d4d0c8;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 2px 6px;
        }
        .sheet-table-wrap table td input {
            width: 100%;
            height: 100%;
            border: none;
            padding: 2px 4px;
            font-size: 11px;
            font-family: inherit;
            background: transparent;
            outline: none;
            min-width: 60px;
        }
        .sheet-table-wrap table td input:focus {
            background: #e8f0fe;
            outline: 2px solid #000080;
            position: relative;
            z-index: 1;
        }
        .sheet-table-wrap table td.selected-cell {
            outline: 2px solid #000080;
            outline-offset: -1px;
            z-index: 1;
            position: relative;
        }
        .cell-addr {
            font-size: 10px;
            font-weight: bold;
            color: #000;
            min-width: 50px;
            text-align: center;
        }

        /* 扫雷 */
        .minesweeper-container {
            display: flex;
            flex-direction: column;
            background: #d4d0c8;
            padding: 6px;
            height: 100%;
            gap: 4px;
            align-items: center;
        }
        .minesweeper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 8px;
            background: #c0c0c0;
            border: 2px inset #808080;
            gap: 8px;
        }
        .mine-counter,
        .mine-timer {
            background: #000;
            color: #f00;
            font-family: 'Courier New', monospace;
            font-size: 22px;
            font-weight: bold;
            padding: 2px 8px;
            min-width: 50px;
            text-align: center;
            letter-spacing: 2px;
            border: 2px inset #808080;
        }
        .mine-face {
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
        }
        .mine-face:active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
        }
        .mine-grid {
            display: grid;
            gap: 0;
            border: 2px inset #808080;
            background: #bdbdbd;
            padding: 2px;
        }
        .mine-cell {
            width: 20px;
            height: 20px;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
            transition: none;
            color: #000;
        }
        .mine-cell.revealed {
            background: #d4d0c8;
            border: 1px solid #808080;
            box-shadow: none;
            cursor: default;
        }
        .mine-cell.flagged {
            color: #f00;
        }
        .mine-cell.mine-exploded {
            background: #f00 !important;
            border-color: #800 !important;
        }

        /* 控制面板 */
        .control-panel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
        }
        .cpl-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            padding: 6px 3px;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            font-size: 10px;
            color: #000;
        }
        .cpl-icon:hover {
            border: 2px dotted #000080;
            background: rgba(0, 0, 128, 0.05);
        }
        .cpl-icon .cpl-img {
            font-size: 28px;
            margin-bottom: 2px;
        }
        .cpl-icon .cpl-label {
            font-size: 9px;
            text-align: center;
            line-height: 1.15;
        }

        /* 打印机 */
        .printer-queue {
            padding: 10px;
            font-size: 11px;
        }
        .printer-queue table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }
        .printer-queue table th,
        .printer-queue table td {
            border: 1px solid #808080;
            padding: 3px 6px;
            text-align: left;
        }
        .printer-queue table th {
            background: #d4d0c8;
        }

        /* 任务栏 */
        #taskbar {
            height: var(--taskbar-height);
            background: var(--win-gray);
            border-top: 2px solid var(--win-highlight);
            display: flex;
            align-items: center;
            padding: 2px 3px;
            gap: 3px;
            z-index: 1000;
            box-shadow: 0 -1px 0 0 #000;
            flex-shrink: 0;
        }
        #start-button {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px 2px 5px;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
            min-width: 55px;
            height: 24px;
            transition: none;
        }
        #start-button:active,
        #start-button.active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
            padding-top: 3px;
            padding-left: 6px;
        }
        #start-button .start-icon {
            font-size: 16px;
            line-height: 1;
        }
        #taskbar-windows {
            display: flex;
            gap: 2px;
            flex: 1;
            overflow-x: auto;
            min-width: 0;
            height: 24px;
            align-items: center;
        }
        .taskbar-window-btn {
            padding: 2px 10px;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            cursor: pointer;
            font-size: 10px;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: inherit;
            letter-spacing: 0.2px;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
            height: 22px;
            flex-shrink: 0;
            transition: none;
        }
        .taskbar-window-btn.active {
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            box-shadow: inset 1px 1px 0 0 #808080, inset -1px -1px 0 0 #fff;
            font-weight: bold;
            padding-top: 3px;
        }
        #system-tray {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            border: 2px solid;
            border-color: var(--win-dark-shadow) var(--win-highlight) var(--win-highlight) var(--win-dark-shadow);
            height: 24px;
            font-size: 10px;
            white-space: nowrap;
            background: var(--win-button-face);
            box-shadow: inset 1px 1px 0 0 #808080;
            letter-spacing: 0.3px;
        }
        #clock {
            font-size: 10px;
            letter-spacing: 0.3px;
        }

        /* 开始菜单 */
        #start-menu {
            position: fixed;
            bottom: var(--taskbar-height);
            left: 2px;
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            box-shadow: 1px 1px 0 0 #000;
            z-index: 999;
            display: none;
            min-width: 200px;
            flex-direction: row;
        }
        #start-menu.show {
            display: flex;
        }
        #start-menu .start-sidebar {
            background: linear-gradient(to bottom, #808080, #606060);
            color: #d0d0d0;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 8px 4px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            flex-shrink: 0;
            text-shadow: 1px 1px 2px #000;
        }
        #start-menu .start-items {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2px 0;
        }
        #start-menu .start-item {
            padding: 6px 14px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: 2px solid transparent;
            letter-spacing: 0.3px;
            color: #000;
            position: relative;
        }
        #start-menu .start-item:hover {
            background: #000080;
            color: #ffffff;
        }
        #start-menu .start-item .menu-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        #start-menu .start-separator {
            height: 2px;
            background: #808080;
            margin: 3px 8px;
            border-top: 1px solid #fff;
        }
        #start-menu .start-item.has-submenu::after {
            content: '►';
            margin-left: auto;
            font-size: 8px;
            color: inherit;
        }
        .submenu {
            position: absolute;
            left: 100%;
            top: 0;
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            box-shadow: 1px 1px 0 0 #000;
            z-index: 1001;
            display: none;
            min-width: 150px;
            flex-direction: column;
            padding: 2px 0;
        }
        .submenu.show {
            display: flex;
        }
        .submenu .start-item {
            padding: 5px 12px;
            font-size: 11px;
        }

        /* 关机 */
        #shutdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #shutdown-overlay.show {
            display: flex;
        }
        #shutdown-dialog {
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            box-shadow: 2px 2px 0 0 #000;
            padding: 0;
            min-width: 300px;
            z-index: 2001;
        }
        #shutdown-dialog .dialog-titlebar {
            background: #000080;
            color: #fff;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #shutdown-dialog .dialog-content {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
        }
        #shutdown-dialog .dialog-icon {
            font-size: 32px;
        }
        #shutdown-dialog .dialog-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 8px 16px 12px;
        }
        #shutdown-dialog .dialog-buttons button {
            padding: 4px 20px;
            font-size: 11px;
            cursor: pointer;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            font-family: inherit;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
        }

        /* 开机 */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a5eb5;
            z-index: 3000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        #boot-screen.show {
            display: flex;
        }
        #boot-screen .boot-text {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }
        #boot-screen .boot-btn {
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #e8e8e8;
            border: 4px solid;
            border-color: #fff #333 #333 #fff;
            font-family: inherit;
            letter-spacing: 2px;
            box-shadow: inset -2px -2px 0 0 #888, inset 2px 2px 0 0 #fff, 4px 4px 12px rgba(0, 0, 0, 0.5);
            color: #000;
        }
        #boot-screen .boot-btn:active {
            border-color: #333 #fff #fff #333;
            box-shadow: inset 2px 2px 0 0 #888, inset -2px -2px 0 0 #fff;
            transform: scale(0.97);
        }
        #boot-screen .boot-icon {
            font-size: 64px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
        }

        /* 右键菜单 */
        #context-menu {
            position: fixed;
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            box-shadow: 1px 1px 0 0 #000;
            z-index: 1500;
            display: none;
            flex-direction: column;
            padding: 2px 0;
            min-width: 170px;
        }
        #context-menu .ctx-item {
            padding: 5px 16px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            border: 2px solid transparent;
            letter-spacing: 0.3px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #context-menu .ctx-item:hover {
            background: #000080;
            color: #fff;
        }
        #context-menu .ctx-item.disabled {
            color: #808080;
            cursor: default;
            pointer-events: none;
        }
        #context-menu .ctx-separator {
            height: 2px;
            background: #808080;
            margin: 2px 8px;
            border-top: 1px solid #fff;
        }
        #context-menu .ctx-item .ctx-shortcut {
            margin-left: auto;
            font-size: 10px;
            color: inherit;
            opacity: 0.7;
        }

        /* 文件浏览器 */
        .file-browser {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #fff;
        }
        .file-browser .fb-toolbar {
            display: flex;
            gap: 3px;
            padding: 3px 5px;
            background: #d4d0c8;
            border-bottom: 1px solid #808080;
            flex-shrink: 0;
            align-items: center;
        }
        .file-browser .fb-toolbar button {
            font-size: 10px;
            padding: 2px 7px;
            cursor: pointer;
            background: var(--win-button-face);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark-shadow) var(--win-dark-shadow) var(--win-highlight);
            font-family: inherit;
            box-shadow: inset -1px -1px 0 0 #808080, inset 1px 1px 0 0 #fff;
        }
        .file-browser .fb-address {
            flex: 1;
            padding: 2px 6px;
            font-size: 10px;
            border: 2px inset #808080;
            background: #fff;
            font-family: inherit;
            min-width: 0;
        }
        .file-browser .fb-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            align-content: flex-start;
            background: #fff;
        }
        .file-browser .fb-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 64px;
            padding: 4px 2px;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            font-size: 9px;
            color: #000;
        }
        .file-browser .fb-item:hover {
            border: 2px dotted #000080;
            background: rgba(0, 0, 128, 0.04);
        }
        .file-browser .fb-item .fb-img {
            font-size: 26px;
            margin-bottom: 2px;
            pointer-events: none;
        }
        .file-browser .fb-item .fb-label {
            font-size: 9px;
            word-wrap: break-word;
            max-width: 58px;
            line-height: 1.15;
            pointer-events: none;
        }

        /* 显示属性对话框 */
        .display-props {
            padding: 16px;
            font-size: 11px;
        }
        .display-props .color-swatch {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 2px inset #808080;
            margin: 4px;
            cursor: pointer;
            vertical-align: middle;
        }
        .display-props .color-swatch:hover {
            outline: 2px solid #000;
        }

        @media (max-width: 600px) {
            .window {
                min-width: 150px;
                min-height: 80px;
                max-width: 94vw !important;
            }
            #desktop-icons {
                left: 3px;
                top: 3px;
                gap: 0px;
            }
            .desktop-icon {
                width: 50px;
                padding: 2px 1px;
            }
            .desktop-icon .icon-image {
                font-size: 18px;
                width: 22px;
                height: 22px;
            }
            .desktop-icon .icon-label {
                font-size: 7px;
                max-width: 44px;
            }
            .mine-cell {
                width: 16px;
                height: 16px;
                font-size: 9px;
            }
            #start-menu {
                min-width: 140px;
                left: 0;
            }
            .submenu {
                left: auto;
                right: 100%;
                min-width: 120px;
            }
            #boot-screen .boot-btn {
                padding: 10px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="win95-container">
        <div id="desktop">
            <div id="desktop-icons">
                <div class="desktop-icon" data-window="mycomputer" data-title="我的电脑" ondblclick="openWindow('mycomputer')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">🖥️</div><div class="icon-label">我的电脑</div>
                </div>
                <div class="desktop-icon" data-window="recycle" data-title="回收站" ondblclick="openWindow('recycle')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">🗑️</div><div class="icon-label">回收站</div>
                </div>
                <div class="desktop-icon" data-window="mydocuments" data-title="我的文档" ondblclick="openWindow('mydocuments')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">📁</div><div class="icon-label">我的文档</div>
                </div>
                <div class="desktop-icon" data-window="c_drive" data-title="硬盘 (C:)" ondblclick="openWindow('c_drive')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">💿</div><div class="icon-label">硬盘 (C:)</div>
                </div>
                <div class="desktop-icon" data-window="d_drive" data-title="光盘 (D:)" ondblclick="openWindow('d_drive')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">📀</div><div class="icon-label">光盘 (D:)</div>
                </div>
                <div class="desktop-icon" data-window="controlpanel" data-title="控制面板" ondblclick="openWindow('controlpanel')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">⚙️</div><div class="icon-label">控制面板</div>
                </div>
                <div class="desktop-icon" data-window="printer" data-title="打印机" ondblclick="openWindow('printer')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">🖨️</div><div class="icon-label">打印机</div>
                </div>
                <div class="desktop-icon" data-window="minesweeper" data-title="扫雷" ondblclick="openWindow('minesweeper')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">💣</div><div class="icon-label">扫雷</div>
                </div>
                <div class="desktop-icon" data-window="notepad" data-title="记事本" ondblclick="openWindow('notepad')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">📝</div><div class="icon-label">记事本</div>
                </div>
                <div class="desktop-icon" data-window="about" data-title="关于 Windows 95" ondblclick="openWindow('about')" onclick="selectDesktopIcon(this,event)">
                    <div class="icon-image">ℹ️</div><div class="icon-label">关于 Windows</div>
                </div>
            </div>
            <div id="windows-container"></div>
        </div>
        <div id="taskbar">
            <button id="start-button" onclick="toggleStartMenu(event)" title="开始"><span class="start-icon">🪟</span> 开始</button>
            <div id="taskbar-windows"></div>
            <div id="system-tray"><span id="clock"></span></div>
        </div>
    </div>

    <!-- 开始菜单 -->
    <div id="start-menu">
        <div class="start-sidebar">Windows 95</div>
        <div class="start-items">
            <div class="start-item has-submenu" data-submenu="programs-submenu" onclick="toggleSubmenu(event,'programs-submenu')"><span class="menu-icon">📋</span> 程序</div>
            <div class="start-item" onclick="openWindow('mydocuments');closeStartMenu();"><span class="menu-icon">📄</span> 文档</div>
            <div class="start-item has-submenu" data-submenu="settings-submenu" onclick="toggleSubmenu(event,'settings-submenu')"><span class="menu-icon">⚙️</span> 设置</div>
            <div class="start-item" onclick="openWindow('c_drive');closeStartMenu();"><span class="menu-icon">🔍</span> 查找</div>
            <div class="start-item" onclick="openWindow('about');closeStartMenu();"><span class="menu-icon">❓</span> 帮助</div>
            <div class="start-item" onclick="openWindow('run');closeStartMenu();"><span class="menu-icon">▶️</span> 运行...</div>
            <div class="start-separator"></div>
            <div class="start-item" onclick="showShutdownDialog();closeStartMenu();"><span class="menu-icon">⏻</span> 关机...</div>
        </div>
        <div class="submenu" id="programs-submenu">
            <div class="start-item has-submenu" data-submenu="accessories-submenu" onclick="toggleSubmenuNested(event,'accessories-submenu')"><span class="menu-icon">📎</span> 附件</div>
            <div class="start-item" onclick="openWindow('c_drive');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">🖥️</span> 资源管理器</div>
            <div class="start-item" onclick="openWindow('minesweeper');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">💣</span> 游戏</div>
        </div>
        <div class="submenu" id="accessories-submenu" style="left:100%;top:0;">
            <div class="start-item" onclick="openWindow('notepad');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">📝</span> 记事本</div>
            <div class="start-item" onclick="openWindow('calculator');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">🔢</span> 计算器</div>
            <div class="start-item" onclick="openWindow('paint');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">🎨</span> 画图</div>
        </div>
        <div class="submenu" id="settings-submenu">
            <div class="start-item" onclick="openWindow('controlpanel');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">⚙️</span> 控制面板</div>
            <div class="start-item" onclick="openWindow('printer');closeStartMenu();closeAllSubmenus();"><span class="menu-icon">🖨️</span> 打印机</div>
        </div>
    </div>

    <div id="shutdown-overlay" onclick="hideShutdownDialog()">
        <div id="shutdown-dialog" onclick="event.stopPropagation()">
            <div class="dialog-titlebar">关闭 Windows</div>
            <div class="dialog-content"><div class="dialog-icon">⏻</div><div>您确定要关闭计算机吗？</div></div>
            <div class="dialog-buttons"><button id="shutdown-yes-btn">是</button><button onclick="hideShutdownDialog()">否</button><button onclick="alert('请保存所有工作后关闭计算机。')">帮助</button></div>
        </div>
    </div>

    <div id="boot-screen">
        <div class="boot-icon">🪟</div><div class="boot-text">Windows 95</div>
        <button class="boot-btn" onclick="powerOn()">开 机</button>
    </div>

    <div id="context-menu">
        <div class="ctx-item" onclick="ctxArrangeIcons()"><span>📐</span> 排列图标<span class="ctx-shortcut"></span></div>
        <div class="ctx-item" onclick="ctxRefresh()"><span>🔄</span> 刷新</div>
        <div class="ctx-separator"></div>
        <div class="ctx-item" onclick="ctxPaste()"><span>📋</span> 粘贴<span class="ctx-shortcut">Ctrl+V</span></div>
        <div class="ctx-item disabled"><span>📄</span> 新建<span class="ctx-shortcut">►</span></div>
        <div class="ctx-separator"></div>
        <div class="ctx-item" onclick="ctxProperties()"><span>ℹ️</span> 属性</div>
    </div>

    <script>
        // ============ 全局状态 ============
        let windowZIndex = 10;
        const openWindows = {};
        let activeWindowId = null;
        let startMenuOpen = false;
        let dragging = null;
        let selectedDesktopIconEl = null;
        let isShutdown = false;

        // 模拟文件系统
        const fileSystem = {
            'C:\\': {
                type: 'folder',
                children: {
                    'Windows': { type: 'folder', children: { 'System': { type: 'folder', children: {} },
                            'Win.ini': { type: 'file', content: '; Windows 95 配置文件' },
                            'explorer.exe': { type: 'file', content: 'EXE文件' } } },
                    'Program Files': { type: 'folder', children: { 'Accessories': { type: 'folder',
                            children: {} }, 'Internet Explorer': { type: 'folder', children: {} } } },
                    'My Documents': { type: 'folder', children: {} },
                    'autoexec.bat': { type: 'file', content: '@echo off\r\nSET PATH=C:\\WINDOWS' },
                    'config.sys': { type: 'file', content: 'DEVICE=C:\\WINDOWS\\HIMEM.SYS' }
                }
            },
            'D:\\': {
                type: 'folder',
                children: {
                    'Setup': { type: 'folder', children: { 'setup.exe': { type: 'file',
                            content: '安装程序' } } },
                    'README.txt': { type: 'file', content: '光盘内容说明文件。' },
                    'Autorun.inf': { type: 'file', content: '[autorun]\nopen=setup.exe' },
                    'Data': { type: 'folder', children: { 'database.mdb': { type: 'file',
                            content: '数据库文件' } } }
                }
            }
        };

        function getFS(path) {
            const parts = path.split('\\').filter(p => p);
            let current = fileSystem['C:\\'];
            if (parts[0] === 'D:') { current = fileSystem['D:\\'];
                parts.shift(); }
            for (const p of parts) {
                if (!current || !current.children || !current.children[p]) return null;
                current = current.children[p];
            }
            return current;
        }

        // ============ 关机/开机 ============
        function showShutdownDialog() { document.getElementById('shutdown-overlay').classList.add('show'); }

        function hideShutdownDialog() { document.getElementById('shutdown-overlay').classList.remove('show'); }

        function performShutdown() {
            hideShutdownDialog();
            closeStartMenu();
            closeAllSubmenus();
            hideContextMenu();
            Object.keys(openWindows).forEach(id => {
                const el = openWindows[id].element;
                if (el && el.parentNode) el.parentNode.removeChild(el);
                delete openWindows[id];
            });
            activeWindowId = null;
            updateTaskbarButtons();
            deselectAllIcons();
            document.getElementById('win95-container').classList.add('shutdown');
            setTimeout(() => { document.getElementById('boot-screen').classList.add('show'); }, 400);
            isShutdown = true;
        }

        function powerOn() {
            document.getElementById('boot-screen').classList.remove('show');
            setTimeout(() => {
                document.getElementById('win95-container').classList.remove('shutdown');
                document.getElementById('windows-container').innerHTML = '';
                Object.keys(openWindows).forEach(k => delete openWindows[k]);
                activeWindowId = null;
                windowZIndex = 10;
                updateTaskbarButtons();
                deselectAllIcons();
                isShutdown = false;
            }, 150);
        }
        document.getElementById('shutdown-yes-btn').addEventListener('click', performShutdown);

        // ============ 窗口管理 ============
        function createWindowElement(id, title, contentHTML, icon = '📄', width = 500, height = 350, left = null,
            top = null) {
            const container = document.getElementById('windows-container');
            if (left === null) { const c = Object.keys(openWindows).length;
                left = 45 + c * 25; if (left > window.innerWidth - 260) left = 25 + c * 16; }
            if (top === null) { const c = Object.keys(openWindows).length;
                top = 30 + c * 28; if (top > window.innerHeight - 200) top = 20 + c * 12; }
            left = Math.max(0, Math.min(left, window.innerWidth - 220));
            top = Math.max(0, Math.min(top, window.innerHeight - 160));
            const winDiv = document.createElement('div');
            winDiv.className = 'window active';
            winDiv.id = 'window-' + id;
            winDiv.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${windowZIndex};`;
            winDiv.setAttribute('data-window-id', id);
            winDiv.innerHTML = `
            <div class="window-titlebar" onmousedown="startDrag(event,'${id}')" ondblclick="toggleMaximize('${id}')">
              <span class="title-icon">${icon}</span><span class="title-text">${title}</span>
              <div class="title-buttons">
                <button class="win-btn win-btn-minimize" onclick="event.stopPropagation();minimizeWindow('${id}')" title="最小化"></button>
                <button class="win-btn win-btn-maximize" id="maxbtn-${id}" onclick="event.stopPropagation();toggleMaximize('${id}')" title="最大化"></button>
                <button class="win-btn win-btn-close" onclick="event.stopPropagation();closeWindow('${id}')" title="关闭"></button>
              </div>
            </div>
            <div class="window-content padded" id="content-${id}">${contentHTML}</div>`;
            container.appendChild(winDiv);
            windowZIndex++;
            winDiv.style.zIndex = windowZIndex;
            openWindows[id] = { title, minimized: false, maximized: false, element: winDiv,
                prevState: { left, top, width, height }, icon };
            activateWindow(id);
            updateTaskbarButtons();
            winDiv.addEventListener('mousedown', function() { activateWindow(id); });
            return winDiv;
        }

        function activateWindow(id) {
            if (!openWindows[id]) return;
            if (activeWindowId === id && !openWindows[id].minimized) return;
            Object.values(openWindows).forEach(w => w.element.classList.remove('active'));
            openWindows[id].element.classList.add('active');
            windowZIndex++;
            openWindows[id].element.style.zIndex = windowZIndex;
            activeWindowId = id;
            if (openWindows[id].minimized) restoreWindow(id);
            updateTaskbarButtons();
            updateMaximizeButton(id);
        }

        function openWindow(id) {
            if (isShutdown) return;
            if (openWindows[id]) { if (openWindows[id].minimized) restoreWindow(id);
                activateWindow(id);
                bringToFront(id); return; }
            let title, content, icon, width, height;
            switch (id) {
                case 'mycomputer':
                    title = '我的电脑';
                    icon = '🖥️';
                    width = 520;
                    height = 380;
                    content = `<div class="icon-view">
                <div class="drive-icon" ondblclick="openWindow('c_drive')"><div class="drv-img">💿</div><div class="drv-label">硬盘 (C:)</div></div>
                <div class="drive-icon" ondblclick="openWindow('d_drive')"><div class="drv-img">📀</div><div class="drv-label">光盘 (D:)</div></div>
                <div class="drive-icon" ondblclick="openWindow('controlpanel')"><div class="drv-img">⚙️</div><div class="drv-label">控制面板</div></div>
                <div class="drive-icon" ondblclick="openWindow('printer')"><div class="drv-img">🖨️</div><div class="drv-label">打印机</div></div>
                <div class="drive-icon" ondblclick="openWindow('mydocuments')"><div class="drv-img">📁</div><div class="drv-label">我的文档</div></div>
              </div>`;
                    break;
                case 'c_drive':
                    title = '硬盘 (C:)';
                    icon = '💿';
                    width = 550;
                    height = 400;
                    content = buildFileBrowser('C:\\');
                    break;
                case 'd_drive':
                    title = '光盘 (D:)';
                    icon = '📀';
                    width = 500;
                    height = 360;
                    content = buildFileBrowser('D:\\');
                    break;
                case 'controlpanel':
                    title = '控制面板';
                    icon = '⚙️';
                    width = 480;
                    height = 340;
                    content = `<div class="control-panel-grid">
                <div class="cpl-icon" ondblclick="openWindow('displayprops')"><div class="cpl-img">🖥️</div><div class="cpl-label">显示</div></div>
                <div class="cpl-icon" ondblclick="openWindow('datetime')"><div class="cpl-img">🕐</div><div class="cpl-label">日期/时间</div></div>
                <div class="cpl-icon" ondblclick="openWindow('printer')"><div class="cpl-img">🖨️</div><div class="cpl-label">打印机</div></div>
                <div class="cpl-icon"><div class="cpl-img">🖱️</div><div class="cpl-label">鼠标</div></div>
                <div class="cpl-icon"><div class="cpl-img">⌨️</div><div class="cpl-label">键盘</div></div>
                <div class="cpl-icon"><div class="cpl-img">🔊</div><div class="cpl-label">声音</div></div>
                <div class="cpl-icon"><div class="cpl-img">🌐</div><div class="cpl-label">网络</div></div>
                <div class="cpl-icon"><div class="cpl-img">🔌</div><div class="cpl-label">系统</div></div>
              </div>`;
                    break;
                case 'displayprops':
                    title = '显示 属性';
                    icon = '🖥️';
                    width = 420;
                    height = 320;
                    content = `<div class="display-props">
                <p><strong>桌面背景颜色：</strong></p>
                <div style="margin:8px 0;">
                  <span class="color-swatch" style="background:#008080;" onclick="changeDesktopColor('#008080')"></span>
                  <span class="color-swatch" style="background:#000080;" onclick="changeDesktopColor('#000080')"></span>
                  <span class="color-swatch" style="background:#4a6d3c;" onclick="changeDesktopColor('#4a6d3c')"></span>
                  <span class="color-swatch" style="background:#6b3a6b;" onclick="changeDesktopColor('#6b3a6b')"></span>
                  <span class="color-swatch" style="background:#3a3a3a;" onclick="changeDesktopColor('#3a3a3a')"></span>

        function closeWindow(id) {
            if (!openWindows[id]) return;
            const el = openWindows[id].element;
            el.style.transition = 'opacity 0.08s';
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
                delete openWindows[id];
                if (activeWindowId === id) {
                    activeWindowId = null;
                    const rem = Object.entries(openWindows);
                    if (rem.length > 0) { const tw = rem.reduce((a, b) => (parseInt(a[1].element.style.zIndex) || 0) > (
                            parseInt(b[1].element.style.zIndex) || 0) ? a : b);
                        activateWindow(tw[0]); }
                }
                updateTaskbarButtons();
            }, 80);
        }

        function minimizeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].minimized = true;
            openWindows[id].element.classList.add('minimized');
            openWindows[id].element.classList.remove('active');
            if (activeWindowId === id) {
                activeWindowId = null;
                const rem = Object.entries(openWindows).filter(([, w]) => !w.minimized);
                if (rem.length > 0) { const tw = rem.reduce((a, b) => (parseInt(a[1].element.style.zIndex) || 0) > (parseInt(
                        b[1].element.style.zIndex) || 0) ? a : b);
                    activateWindow(tw[0]); }
            }
            updateTaskbarButtons();
        }

        function restoreWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].minimized = false;
            openWindows[id].element.classList.remove('minimized');
            activateWindow(id);
            bringToFront(id);
            updateTaskbarButtons();
        }

        function toggleMaximize(id) {
            if (!openWindows[id]) return;
            const w = openWindows[id];
            if (w.maximized) {
                w.maximized = false;
                w.element.classList.remove('maximized');
                w.element.style.left = w.prevState.left + 'px';
                w.element.style.top = w.prevState.top + 'px';
                w.element.style.width = w.prevState.width + 'px';
                w.element.style.height = w.prevState.height + 'px';
                w.element.style.resize = 'both';
            } else {
                w.prevState = { left: parseInt(w.element.style.left), top: parseInt(w.element.style.top), width: parseInt(
                        w.element.style.width), height: parseInt(w.element.style.height) };
                w.maximized = true;
                w.element.classList.add('maximized');
                w.element.style.resize = 'none';
            }
            updateMaximizeButton(id);
            activateWindow(id);
        }

        function updateMaximizeButton(id) {
            const btn = document.getElementById('maxbtn-' + id);
            if (!btn) return;
            const w = openWindows[id];
            btn.className = w && w.maximized ? 'win-btn win-btn-restore' : 'win-btn win-btn-maximize';
            btn.title = w && w.maximized ? '还原' : '最大化';
        }

        function bringToFront(id) { if (!openWindows[id]) return;
            windowZIndex++;
            openWindows[id].element.style.zIndex = windowZIndex; }

        // ============ 拖动 ============
        function startDrag(e, id) {
            if (!openWindows[id] || openWindows[id].maximized) return;
            e.preventDefault();
            dragging = { windowId: id, startX: e.clientX, startY: e.clientY, origLeft: parseInt(openWindows[id].element
                    .style.left), origTop: parseInt(openWindows[id].element.style.top) };
            activateWindow(id);
            bringToFront(id);
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            document.body.style.cursor = 'move';
        }

        function onDrag(e) {
            if (!dragging) return;
            const w = openWindows[dragging.windowId];
            if (!w || w.maximized) return;
            w.element.style.left = Math.max(-35, Math.min(dragging.origLeft + e.clientX - dragging.startX, window
            .innerWidth - 45)) + 'px';
            w.element.style.top = Math.max(-10, Math.min(dragging.origTop + e.clientY - dragging.startY, window
            .innerHeight - 40)) + 'px';
        }

        function stopDrag() { dragging = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.body.style.cursor = 'default'; }

        // ============ 任务栏 ============
        function updateTaskbarButtons() {
            const c = document.getElementById('taskbar-windows');

            Object.entries(openWindows).forEach(([id, w]) => {
                const btn = document.createElement('button');
                btn.className = 'taskbar-window-btn' + (id === activeWindowId && !w.minimized ? ' active' : '');
                btn.textContent = w.icon + ' ' + w.title;
                btn.title = w.title;
                btn.onclick = function(e) { e.stopPropagation(); if (w.minimized) restoreWindow(id);
                    else if (id === activeWindowId) minimizeWindow(id);
                    else { activateWindow(id);
                        bringToFront(id); } };
                c.appendChild(btn);
            });
        }

                    );

        function initSheetEditor(id) {
            const table = document.getElementById('editable-sheet-table');
            if (!table) return;
            table.addEventListener('click', function(e) {
                const inp = e.target.closest('input');
                if (inp) sheetSelectCell(inp);
            });
        }

        function sheetSelectCell(inp) {
            document.querySelectorAll('#editable-sheet-table td').forEach(td => td.classList.remove(
            'selected-cell'));
            const td = inp.closest('td');
            if (td) td.classList.add('selected-cell');
            const addr = document.getElementById('cell-addr-display');
            if (addr && inp) {
                const r = parseInt(inp.dataset.row);
                const c = parseInt(inp.dataset.col);
                addr.textContent = String.fromCharCode(65 + c) + r;
            }
        }

        function sheetRecalc() {
            const table = document.getElementById('editable-sheet-table');
            if (!table) return;
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td input');
                if (cells.length >= 5) {
                    const sales = parseFloat(cells[1].value) || 0;
                    const cost = parseFloat(cells[2].value) || 0;
                    const profit = sales - cost;
                    cells[3].value = profit.toFixed(0);
                    cells[4].value = sales > 0 ? (profit / sales * 100).toFixed(1) + '%' : '0%';
                }
            });
        }

        function sheetAddRow() {
            const table = document.getElementById('editable-sheet-table');
            if (!table) return;
            const tbody = table.querySelector('tbody');
            const cols = table.querySelector('thead tr').children.length;
            const rowNum = tbody.children.length + 1;
            let tr = '<tr>';
            for (let i = 0; i < cols; i++) tr +=
                `<td><input value="" data-row="${rowNum}" data-col="${i}" onfocus="sheetSelectCell(this)" onchange="sheetRecalc()"></td>`;
            tr += '</tr>';
            tbody.insertAdjacentHTML('beforeend', tr);
        }

        function sheetAddCol() {
            const table = document.getElementById('editable-sheet-table');
            if (!table) return;
            const thead = table.querySelector('thead tr');
            const newColIdx = thead.children.length;
            const colLetter = String.fromCharCode(65 + newColIdx);
            thead.insertAdjacentHTML('beforeend', `<th>${colLetter}</th>`);
            table.querySelectorAll('tbody tr').forEach((row, ri) => {
                row.insertAdjacentHTML('beforeend',
                    `<td><input value="" data-row="${ri+1}" data-col="${newColIdx}" onfocus="sheetSelectCell(this)" onchange="sheetRecalc()"></td>`
                    );
            });
        }
        window.sheetRecalc = sheetRecalc;
        window.sheetAddRow = sheetAddRow;
        window.sheetAddCol = sheetAddCol;
        window.sheetSelectCell = sheetSelectCell;
